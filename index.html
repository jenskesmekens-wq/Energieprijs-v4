<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1928"><link rel="manifest" href="manifest.webmanifest"><title>Energieprijs Zele</title><style>body{margin:0;background:#091727;color:#f4f8ff;font:16px system-ui}.w{max-width:850px;margin:auto;padding:18px}.muted{color:#9cc3ed}.top{display:flex;justify-content:space-between;align-items:center}.hero,.c{background:#17283b;border:1px solid #2b4056;border-radius:22px}.hero{padding:24px;margin:20px 0}.p{font-size:clamp(48px,12vw,72px);font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.c{padding:16px}.v{font-size:24px;font-weight:800}.r{display:grid;grid-template-columns:85px 1fr 100px;gap:8px;padding:9px 0;border-bottom:1px solid #2b4056}.bar{height:9px;background:#26394d;margin-top:6px;border-radius:8px}.bar i{display:block;height:100%;background:#22c7a3;border-radius:8px}button{background:#22c7a3;border:0;border-radius:14px;padding:11px 15px;font-weight:800}.err{display:none;background:#8b5a00;padding:11px;border-radius:12px;margin-top:12px}</style></head><body><main class="w"><div class="top"><div><b>⚡ Energieprijs Zele</b><div id="stamp" class="muted">Laden...</div></div><button onclick="load()">Vernieuw</button></div><div id="err" class="err"></div><section class="hero"><div class="muted">Huidige effectieve afnameprijs</div><div id="current" class="p">--,--</div><div>c€/kWh</div><p class="muted">Energie + 6% btw + kWh-net + accijns. Zonder jaarlijkse vaste kosten, databeheer en capaciteitstarief.</p></section><div class="grid"><div class="c"><div class="muted">Spotprijs</div><div id="spot" class="v">-- €/MWh</div></div><div class="c"><div class="muted">Energie incl. btw</div><div id="energy" class="v">-- c€/kWh</div></div><div class="c"><div class="muted">kWh-net + accijns</div><div class="v">10,15545 c€/kWh</div></div></div><section class="c" style="margin-top:12px"><b>Effectieve prijs per kwartier</b><div id="rows"></div></section></main><script>
const K={b:.7134,m:.1039,vat:1.06,net:5.27945,exc:4.876};const F=n=>Number(n).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2});const E=p=>(K.b+K.m*p)*K.vat,T=p=>E(p)+K.net+K.exc;
function arr(j){for(const k of ['prices','data','items','quarter_hours','hours'])if(Array.isArray(j?.[k]))return j[k];return Array.isArray(j)?j:[]}function p(x){return Number(x?.price_eur_mwh??x?.price??x?.value)}function tm(x,i){let s=x.start_time||x.start||x.datetime||x.timestamp||x.time;if(!s)return String(i);let d=new Date(s);return isNaN(d)?String(s).slice(0,5):d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'})}
async function load(){try{const r=await fetch('prices.json?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json(),cj=j.current?.current||j.current,sp=p(cj);if(!Number.isFinite(sp))throw Error('Geen geldige actuele prijs');spot.textContent=F(sp)+' €/MWh';energy.textContent=F(E(sp))+' c€/kWh';current.textContent=F(T(sp));stamp.textContent='Data bijgewerkt: '+new Date(j.updated_at).toLocaleString('nl-BE');let q=arr(j.today).map((x,i)=>({p:p(x),t:tm(x,i)})).filter(x=>Number.isFinite(x.p));let mx=Math.max(1,...q.map(x=>T(x.p)));rows.innerHTML=q.map(x=>`<div class="r"><b>${x.t}</b><div class="bar"><i style="width:${Math.max(2,T(x.p)/mx*100)}%"></i></div><b>${F(T(x.p))} c€</b></div>`).join('')||'<div class="muted">Geen kwartierreeks beschikbaar.</div>';err.style.display='none'}catch(e){err.textContent='Prijsbestand nog niet beschikbaar: '+e.message;err.style.display='block';stamp.textContent='Nog geen data'}}load();setInterval(load,300000);
</script></body></html>
