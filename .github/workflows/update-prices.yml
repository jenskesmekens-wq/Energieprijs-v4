name: Update energy prices
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SmartPrice data
        shell: bash
        run: |
          set -e
          curl -fsSL --retry 3 https://api.smartprice.be/api/current -o current.json
          curl -fsSL --retry 3 https://api.smartprice.be/api/prices/today -o today.json
          python3 - <<'PY'
          import json, datetime
          with open('current.json', encoding='utf-8') as f: current=json.load(f)
          with open('today.json', encoding='utf-8') as f: today=json.load(f)
          out={'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'current':current,'today':today}
          with open('prices.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          PY
          rm current.json today.json
      - name: Commit fresh data
        shell: bash
        run: |
          git config user.name "energy-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Update energy prices"
          git push
